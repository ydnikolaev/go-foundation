# Project-owned: devkit seeded this once and never touches it again. Edit freely.
# The module registry: one section per module; scripts/kit/modules.py is the one reader (`python3 scripts/kit/modules.py lint`).
# Keys: paths (required; globs separated by spaces or lines), deps (modules, family members or a whole family `pkg-*` this
# module may import), deps.<value> (a family only: extra deps of the one member that value binds), check (make targets),
# planned (<epic>:<PHASE>: a module declared before its files exist).
# Globs are anchored at the repo root: `*` stays inside one path segment, a `**` segment matches zero or more segments.
# A path belongs to the first section whose glob matches it. A section name with one `*` is a family: one member per value
# of that `*` (every glob of the family has one lone `*`, all binding the same value). `[shared]` takes paths only: files
# every module may depend on; a change there selects every module.
# Once one module is declared, every code path of the repo must belong to a module or to [shared] (lint refuses the rest).
# Comments: a full line starting with `#` or `;`; an inline comment only with `;`.

# Example (uncomment and adapt):
# [shared]
# paths = go.mod go.sum tsconfig.json
#
# [pkg-*]                          ; one module per directory under pkg/: pkg-kit owns pkg/kit/**
# paths = pkg/*/**
# deps.render = pkg-contracts      ; ... and pkg-render may also import its sibling pkg-contracts
#
# [mod-*]                          ; mod-orders owns modules/orders/**, cmd/orders/** and mk/orders.mk
# paths = modules/*/** cmd/*/** mk/*.mk
# deps = pkg-*                     ; every pkg-* member
# check = test-mod                 ; make targets that check this module

# go-foundation: every unit is a module (R-1). [shared] first, so root files never fall into the family.
[shared]
paths = Makefile GNUmakefile go.work CLAUDE.md UNITS.md LICENSE .gitignore .copier-answers.devkit.yml
        scripts/** config/** docs/** mk/** .claude/** .devkit/**

[unit-*]                           ; unit-adoption owns units/adoption/**; deps.<id> = unit-<other> for a unit-to-unit require
paths = units/*/**

[compose]
generated = UNITS.md units-catalogue
